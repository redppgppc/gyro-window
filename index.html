<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Gyro Window</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #fff; font-family: sans-serif; }
  #start { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; background: #000c; }
  #status { position: fixed; left: 8px; top: 6px; font-size: 13px; opacity: .8; }
  #credit { position: fixed; left: 8px; bottom: 6px; font-size: 11px; opacity: .7; }
  #credit a { color: #fff; }
</style>
</head>
<body>
<div id="start">탭해서 시작 (카메라 사용)</div>
<div id="status"></div>
<!-- CC-BY 표기: 모델 제목, 제작자, 원본 링크, 라이선스 -->
<!-- TODO: 제작자 정보 확인 후 주석 해제
<div id="credit">"<a href="MODEL_URL">Little sea house</a>" by <a href="AUTHOR_URL">AUTHOR_NAME</a>, <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a></div>
-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script type="module">
const MP = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const { FilesetResolver, FaceDetector } = await import(`${MP}/vision_bundle.mjs`);
// 화면 = z=0 평면에 뚫린 창문. 단위는 cm. 눈 위치에 맞춰 비대칭(off-axis) 투영을 한다.
const EYE_DIST = 30;  // 얼굴을 찾기 전 기본 눈-화면 거리
const SMOOTH = 0.3;   // 0~1, 작을수록 부드럽고 느림 (얼굴 인식이 떨리면 낮추기)
const DEPTH = 40;     // 방 깊이
const W = 7;          // 화면 가로 (폰 대략 7cm)
let H = 7;            // 화면 세로, 비율에 맞춰 resize에서 계산

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera();
scene.add(new THREE.HemisphereLight(0xffffff, 0x223344, 1));
const sun = new THREE.DirectionalLight(0xffffff, 0.6);
sun.position.set(5, 10, 10);
scene.add(sun);

// 화면 뒤로 이어지는 격자 방
let room;
function buildRoom() {
  if (room) scene.remove(room);
  room = new THREE.Group();
  const x = W / 2, y = H / 2, p = [];
  for (let z = 0; z >= -DEPTH; z -= 4)
    p.push(-x,-y,z, x,-y,z,  x,-y,z, x,y,z,  x,y,z, -x,y,z,  -x,y,z, -x,-y,z);
  for (let i = 0; i <= 4; i++) {
    const a = -x + W * i / 4, b = -y + H * i / 4;
    p.push(a,-y,0, a,-y,-DEPTH,  a,y,0, a,y,-DEPTH,  -x,b,0, -x,b,-DEPTH,  x,b,0, x,b,-DEPTH);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
  room.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0x33ccff })));
  scene.add(room);
  if (model) model.position.y = -H / 2 - modelBottom; // 바닥에 앉힘 (H가 바뀌면 다시)
}

// 모델: 가로가 화면 폭의 MODEL_FIT배가 되게 맞추고, 화면 뒤 MODEL_Z 깊이 바닥에 놓는다
const MODEL_FIT = 0.9;  // 조정값
const MODEL_Z = -14;    // 조정값 (0=화면 면, 음수=화면 안쪽)
let model = null, modelBottom = 0, mixer = null;
new THREE.GLTFLoader().load('models/little_sea_house.glb', gltf => {
  model = gltf.scene;
  const box = new THREE.Box3().setFromObject(model), size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
  const s = W * MODEL_FIT / Math.max(size.x, size.z);
  model.scale.setScalar(s);
  model.position.set(-c.x * s, 0, MODEL_Z - c.z * s);
  modelBottom = box.min.y * s;
  model.position.y = -H / 2 - modelBottom;
  scene.add(model);
  if (gltf.animations.length) {
    mixer = new THREE.AnimationMixer(model);
    mixer.clipAction(gltf.animations[0]).play();
  }
}, undefined, err => console.error('모델 로드 실패', err));

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  H = W * innerHeight / innerWidth;
  buildRoom();
}
addEventListener('resize', resize);
resize();

// 눈(ex,ey,ez)에서 화면 네 모서리를 지나는 절두체 (near 평면 기준)
function frustum(ex, ey, ez, n) {
  const k = n / ez;
  return [(-W / 2 - ex) * k, (W / 2 - ex) * k, (H / 2 - ey) * k, (-H / 2 - ey) * k];
}
console.assert((([l, r, t, b]) => l === -r && t === -b)(frustum(0, 0, EYE_DIST, 1)), '중앙 시점이면 대칭 절두체여야 함');

// 얼굴 추적: 전면 카메라 영상에서 두 눈 위치 -> 화면 기준 눈 좌표(cm)
// 눈 사이 거리(px)로 거리 z를, 두 눈 중점으로 x,y를 구한다. 카메라 렌즈는 화면 위쪽 가운데에 있다고 가정.
const IPD = 6.3;          // 사람 눈 사이 거리 cm (조정값)
const CAM_FOV = 60;       // 전면 카메라 가로 화각, 도 (조정값: 거리가 실제보다 멀게/가깝게 잡히면 수정)
const CAM_Y_OFFSET = 0.5; // 렌즈가 화면 위쪽 끝보다 얼마나 위에 있는지 cm (조정값)

// r,l: 정규화(0~1) 눈 좌표, aspect = 영상 세로/가로. 반환값은 카메라 렌즈 기준 cm.
function eyeFromFace(r, l, aspect) {
  const t = Math.tan(CAM_FOV * Math.PI / 360);
  const d = Math.hypot(l.x - r.x, (l.y - r.y) * aspect);
  const z = IPD / (2 * d * t);
  const mx = (l.x + r.x) / 2, my = (l.y + r.y) / 2;
  // 전면 카메라 원본 영상은 좌우가 사용자 기준과 반대라 0.5 - mx
  return { x: (0.5 - mx) * 2 * z * t, y: (0.5 - my) * 2 * z * t * aspect, z };
}
{ // 정중앙, 눈 간격이 30cm 거리에 해당하면 (0,0,30)이어야 함
  const t = Math.tan(CAM_FOV * Math.PI / 360), h = IPD / (2 * 30 * t) / 2;
  const e = eyeFromFace({ x: 0.5 - h, y: 0.5 }, { x: 0.5 + h, y: 0.5 }, 0.75);
  console.assert(Math.abs(e.x) < 1e-9 && Math.abs(e.y) < 1e-9 && Math.abs(e.z - 30) < 1e-9, 'eyeFromFace 중앙 검사 실패');
}

const statusEl = document.getElementById('status');
const say = s => { statusEl.textContent = s; };
let detector = null, video = null, lastT = -1;

async function startTracking() {
  try {
    say('카메라 켜는 중…');
    video = Object.assign(document.createElement('video'), { playsInline: true, muted: true });
    video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
    await video.play();
    say('얼굴 인식 모델 불러오는 중…');
    const vision = await FilesetResolver.forVisionTasks(`${MP}/wasm`);
    detector = await FaceDetector.createFromOptions(vision, {
      baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite', delegate: 'CPU' },
      runningMode: 'VIDEO',
    });
    say('');
  } catch (err) {
    console.error(err);
    say('카메라를 쓸 수 없어요: ' + err.message);
  }
}

function track() {
  if (!detector || video.currentTime === lastT) return;
  lastT = video.currentTime;
  const f = detector.detectForVideo(video, performance.now()).detections[0];
  if (!f) return say('얼굴을 찾는 중…');
  say('');
  const [r, l] = f.keypoints; // 0: 오른쪽 눈, 1: 왼쪽 눈
  const e = eyeFromFace(r, l, video.videoHeight / video.videoWidth);
  target.x = e.x;
  target.y = e.y + H / 2 + CAM_Y_OFFSET;
  target.z = Math.min(100, Math.max(15, e.z));
}

const eye = { x: 0, y: 0, z: EYE_DIST }, target = { x: 0, y: 0, z: EYE_DIST }, clock = new THREE.Clock();
function animate() {
  if (mixer) mixer.update(clock.getDelta());
  track();
  eye.x += (target.x - eye.x) * SMOOTH;
  eye.y += (target.y - eye.y) * SMOOTH;
  eye.z += (target.z - eye.z) * SMOOTH;
  const n = 0.5, [l, r, t, b] = frustum(eye.x, eye.y, eye.z, n);
  camera.position.set(eye.x, eye.y, eye.z);
  camera.projectionMatrix.makePerspective(l, r, t, b, n, 500);
  camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

// 카메라를 못 쓸 때(PC 등) 테스트용: 마우스로 시점 이동
addEventListener('pointermove', e => {
  if (detector || e.pointerType !== 'mouse') return;
  target.x = (e.clientX / innerWidth * 2 - 1) * W;
  target.y = -(e.clientY / innerHeight * 2 - 1) * H;
});

document.getElementById('start').onclick = e => {
  e.currentTarget.remove();
  startTracking();
};
</script>
</body>
</html>
